[project]
name = "masked-shred"
version = "0.1.0"
description = "Real-time state reconstruction from sparse, asynchronous, and incomplete sensor measurements"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "torch>=2.2",
    "tqdm>=4.66",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
notebooks = [
    "cmcrameri>=1.9",
    "ipywidgets>=8.1",
    "jupyterlab>=4.0",
    "mikeio>=1.26",
    "modelskill>=1.4",
    "optuna>=3.6",
    "scipy>=1.12",
    "seaborn>=0.13",
    "the-well>=1.1",
    "xarray>=2024.1",
]

[tool.uv]
package = false

default-groups = ["dev", "notebooks"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
